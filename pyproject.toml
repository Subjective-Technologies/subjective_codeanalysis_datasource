[project]
name = "subjective_codeanalysis_datasource"
description = "Subjective v2 datasource: local-only AI source-code detector / code analysis."
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "subjective-abstract-data-source-package @ git+https://github.com/Subjective-Technologies/subjective-abstract-data-source-package.git",
    "brainboost-data-source-logger-package @ git+https://github.com/Subjective-Technologies/brainboost_data_source_logger_package.git",
    "brainboost-configuration-package @ git+https://github.com/Subjective-Technologies/brainboost_configuration_package.git",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "SubjectiveCodeanalysisDataSource.py",
    "source_code_ai_detector.py",
    "icon.svg",
]
